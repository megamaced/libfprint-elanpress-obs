name: Refresh libfprint Elan backport

on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

concurrency:
  group: libfprint-obs
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Update and verify the OBS package
        env:
          OBS_PRODUCTION_TOKEN: ${{ secrets.OBS_PRODUCTION_TOKEN }}
        run: python3 -B sync.py
